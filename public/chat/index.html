<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Chat</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:system-ui,sans-serif;color:#172033}main{max-width:820px;margin:auto;min-height:100vh;padding:24px 16px;display:flex;flex-direction:column}header a{color:#52607a;text-decoration:none}#messages{flex:1;background:#fff;border-radius:18px;padding:20px;min-height:55vh;box-shadow:0 8px 28px #16233a12}.bubble{max-width:78%;padding:12px 15px;margin:10px 0;border-radius:15px;white-space:pre-wrap}.assistant{background:#edf1f8}.user{background:#315bea;color:#fff;margin-left:auto}.controls,.send{display:flex;gap:10px;margin-top:14px}.controls>*{padding:11px;border:1px solid #d5dbea;border-radius:10px;background:#fff}.controls input,.send input{flex:1}.send input{padding:13px;border:1px solid #ccd4e5;border-radius:12px;font-size:16px}.send button{border:0;border-radius:12px;padding:0 24px;background:#315bea;color:#fff;font-weight:700}</style></head><body><main><header><a href="/">← AI Desk</a><h1>💬 Chat</h1></header><section id="messages"><div class="bubble assistant">สวัสดีครับ มีอะไรให้ช่วยไหม</div></section><form id="chat-form"><div class="controls"><select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select><input id="model" placeholder="Model (ค่า default)"></div><div class="send"><input id="message" required autocomplete="off" placeholder="พิมพ์ข้อความ..."><button>ส่ง</button></div></form></main><script src="/chat/app.js"></script></body></html>
