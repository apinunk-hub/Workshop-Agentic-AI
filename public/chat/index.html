<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Desk — Lion Chat</title>
  <style>
    :root{--orange:#f97316;--deep:#c2410c;--ink:#2b1a12;--glass:rgba(255,255,255,.68);--line:rgba(255,255,255,.8)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% 5%,#fff 0 18%,transparent 42%),linear-gradient(135deg,#fffaf5,#ffe6ce 52%,#fff);overflow-x:hidden}
    .orb{position:fixed;border-radius:50%;filter:blur(1px);pointer-events:none;z-index:-1}.orb.one{width:260px;height:260px;right:-70px;top:9%;background:#fb923c55;box-shadow:0 0 90px #fb923c88}.orb.two{width:180px;height:180px;left:-50px;bottom:12%;background:#fed7aa99;box-shadow:0 0 70px #fdba7488}
    main{width:min(1050px,100%);min-height:100vh;margin:auto;padding:24px 18px;display:flex;flex-direction:column;gap:18px}.topbar,.chat-card,.composer{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 24px 60px #9a341c1c,0 4px 12px #fff8}.topbar{border-radius:25px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 1px #fff,0 20px 50px #9a341c1c}.brand{display:flex;align-items:center;gap:13px}.lion{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:linear-gradient(145deg,#fff,#fed7aa);box-shadow:8px 8px 16px #c2410c22,-5px -5px 12px #fff;border:1px solid #fff}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:#8a5133;font-size:12px}.back{color:var(--deep);font-weight:700;text-decoration:none}.chat-card{flex:1;min-height:58vh;border-radius:30px;padding:24px;position:relative;overflow:hidden}.chat-card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#fff9,transparent 35%,#f9731612 75%,#fff8);pointer-events:none}.welcome{text-align:center;padding:12px 0 24px;position:relative}.welcome .hero-lion{font-size:62px;filter:drop-shadow(0 10px 8px #c2410c33);animation:float 4s ease-in-out infinite}.welcome h2{margin:5px 0;color:#7c2d12}.welcome p{margin:0;color:#9a6044;font-size:14px}.bubble-row{display:flex;align-items:flex-end;gap:10px;margin:14px 0;position:relative}.bubble-row.user{justify-content:flex-end}.avatar{width:34px;height:34px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#fed7aa);box-shadow:4px 5px 10px #c2410c22;font-size:19px;flex:none}.bubble{max-width:min(680px,82%);padding:14px 17px;border-radius:20px;line-height:1.65;white-space:pre-wrap;box-shadow:0 10px 20px #9a341c16,inset 0 1px #fff}.assistant .bubble{background:#ffffffaa;border:1px solid #fff}.user .bubble{color:#fff;background:linear-gradient(145deg,#fb923c,#ea580c);border:1px solid #fdba74;box-shadow:0 10px 22px #ea580c44}.composer{border-radius:24px;padding:12px}.controls{display:flex;gap:9px;margin-bottom:10px}.controls>*{border:1px solid #fed7aa;background:#fff9;color:#7c2d12;border-radius:12px;padding:10px 12px;outline:none}.controls select{min-width:170px}.controls input{flex:1}.send{display:flex;gap:10px}.send input{flex:1;border:1px solid #fed7aa;background:#fff;border-radius:15px;padding:15px;font-size:15px;outline:none;color:var(--ink);box-shadow:inset 0 2px 8px #c2410c0d}.send input:focus,.controls>*:focus{border-color:var(--orange);box-shadow:0 0 0 4px #fb923c22}.send button{border:0;border-radius:15px;padding:0 27px;color:#fff;background:linear-gradient(145deg,#fb923c,#ea580c);font-weight:800;box-shadow:0 8px 16px #ea580c44;cursor:pointer;transition:.2s}.send button:hover{transform:translateY(-2px);box-shadow:0 12px 22px #ea580c55}.send button:disabled{opacity:.6;cursor:wait}.typing{display:flex;gap:5px;align-items:center;color:#9a6044;font-size:13px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes float{50%{transform:translateY(-7px) rotate(2deg)}}@keyframes pulse{50%{opacity:.25;transform:translateY(-3px)}}@media(max-width:620px){main{padding:12px}.topbar{padding:13px 14px}.chat-card{padding:15px;border-radius:23px}.controls{flex-wrap:wrap}.controls>*{flex:1;min-width:0}.bubble{max-width:86%}.send button{padding:0 18px}}
  </style>
</head>
<body><div class="orb one"></div><div class="orb two"></div><main><header class="topbar"><div class="brand"><div class="lion">🦁</div><div><h1>Lion AI Desk</h1><p>ผู้ช่วยอัจฉริยะของคุณ</p></div></div><a class="back" href="/">หน้าหลัก</a></header><section class="chat-card" id="messages"><div class="welcome"><div class="hero-lion">🦁</div><h2>สวัสดีครับ ผม Lion</h2><p>พร้อมช่วยคิด สร้างสรรค์ และตอบคำถามของคุณ</p></div><div class="bubble-row assistant"><div class="avatar">🦁</div><div class="bubble">มีอะไรให้ผมช่วยวันนี้ไหมครับ?</div></div></section><form class="composer" id="chat-form"><div class="controls"><select id="provider" aria-label="เลือก provider"><option value="gemini">✦ Gemini</option><option value="openai">◈ OpenAI</option><option value="openai-compat">◇ Custom gateway</option></select><input id="model" placeholder="Model (ค่า default)"></div><div class="send"><input id="message" required autocomplete="off" placeholder="พิมพ์ข้อความถึง Lion..."><button type="submit">ส่งคำถาม ↗</button></div></form></main><script src="/chat/app.js"></script></body></html>
